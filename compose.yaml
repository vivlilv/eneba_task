services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eneba
      POSTGRES_PASSWORD: eneba_dev
      POSTGRES_DB: eneba
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eneba_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eneba -d eneba"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  eneba_pgdata:
